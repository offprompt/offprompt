packages:
  - apps/*
  - packages/*

catalog:
  "@eslint/js": ^10.0.1
  "@modelcontextprotocol/sdk": ^1.31.0
  "@playwright/test": ^1.63.0
  "@types/node": ^24.13.4
  esbuild: ^0.28.2
  eslint: ^10.10.0
  turbo: ^2.11.3
  typescript: ~5.9.3
  typescript-eslint: ^8.70.0
  vitest: ^5.0.0

# esbuild's install script checks its platform binary. The docs' Vocs pulls in es5-ext,
# whose script only prints a message, and vue-demi, whose script picks a Vue version
# nothing here uses.
allowBuilds:
  es5-ext: false
  esbuild: true
  vue-demi: false
