# Typecheck, lint and test every package on Linux, Windows and macOS, then run the page's
# browser tests. Every step runs even when an earlier one failed, so one run shows every failure.
#
# A pull request is checked as it will land: main takes changes only through pull requests, each
# up to date with main when it merges, so what lands on main was checked already.
name: check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # A Windows checkout turns line endings into CRLF unless told otherwise.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs do not build on Windows: Vocs writes a page's path, such as
      # reference\providers\upstash.mdx, into code where \u reads as an escape. They are built
      # and served from Linux.
      - name: Typecheck, lint and test
        run: pnpm exec turbo run typecheck lint test --continue --concurrency=1 ${{ runner.os == 'Windows' && '--filter=!@offprompt/docs' || '' }}

      - name: Install the browsers
        if: ${{ !cancelled() }}
        run: pnpm --filter offprompt exec playwright install --with-deps

      - name: Browser tests
        if: ${{ !cancelled() }}
        run: pnpm exec turbo run test:browser --filter offprompt

  # The real Claude Code, Codex and Pi, each against a scripted model, so no account is needed:
  # each loads offprompt from a project, starts it, and passes the calls and results through.
  # Then each again with offprompt installed for it by npx offprompt init -g, from the package
  # as it is packed for npm, and started by the plugin's launcher.
  hosts:
    name: hosts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned to the versions the runs were written against; Pi comes through npx, pinned too.
      - name: Install Claude Code and Codex
        run: npm install --global @anthropic-ai/claude-code@2.1.289 @openai/codex@0.159.3

      - name: Build offprompt and its installer
        run: pnpm exec turbo run build --filter offprompt --filter @offprompt/install

      - name: Install the browser
        run: pnpm --filter @offprompt/e2e exec playwright install --with-deps chromium

      - name: The hosts against a scripted model
        run: pnpm --filter @offprompt/e2e hosts

      - name: The hosts with offprompt installed for them by init -g
        if: ${{ !cancelled() }}
        run: pnpm --filter @offprompt/e2e global

      - name: Keep what the runs produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosts-${{ matrix.os }}
          path: packages/e2e/runs

  # Claude Code against a scripted model on a machine the person reaches over SSH, where
  # offprompt exposes the page through a real Cloudflare quick tunnel and the run fills it at
  # its https address. Its failure fails nothing: a quick tunnel depends on Cloudflare's free
  # service, which promises no uptime, and on its new hostname reaching DNS in time, so a red
  # run here can be Cloudflare's rather than offprompt's.
  tunnel:
    name: tunnel on ubuntu-latest
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.289

      - name: Build offprompt and its installer
        run: pnpm exec turbo run build --filter offprompt --filter @offprompt/install

      - name: Install the browser
        run: pnpm --filter @offprompt/e2e exec playwright install --with-deps chromium

      - name: A page through a Cloudflare quick tunnel
        run: pnpm --filter @offprompt/e2e tunnel
        env:
          E2E_TUNNEL: '1'

      - name: Keep what the run produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel
          path: packages/e2e/runs

  # A pull request that changes what npm ships, the server or its installer, says how in a
  # changeset: `pnpm changeset`. Changesets versions offprompt alone, so the installer's files
  # are looked for here. The release pull request, on a changeset-release/ branch, uses the
  # changesets up, so it goes without, and so does Dependabot's, whose bumps the next release's
  # changeset can mention.
  changeset:
    if: >-
      github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: A changeset, when the package npm ships changes
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if ! grep -qE '^packages/(offprompt|install)/((src|plugin|scripts)/|package\.json$)' <<< "$changed"; then
            exit 0
          fi
          if grep -E '^\.changeset/[^/]+\.md$' <<< "$changed" | grep -qv '^\.changeset/README\.md$'; then
            exit 0
          fi
          echo "This changes the offprompt package npm ships. Add a changeset with: pnpm changeset"
          exit 1
        env:
          BASE: ${{ github.base_ref }}

  # The one check main's ruleset requires before a pull request merges: it passes when every
  # job above passed or was skipped, so the matrices can change without the ruleset. The
  # tunnel is left out, since its failure fails nothing.
  all:
    name: all checks
    if: ${{ always() }}
    needs: [check, hosts, changeset]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
