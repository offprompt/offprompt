# Releases offprompt from main. Each change that reaches npm says what it is in a changeset
# (`pnpm changeset`); while any wait, Changesets keeps a "Release offprompt" pull request open
# with the next version and its changelog entry. Merging it is the release: the version npm
# does not have yet goes to npm, to a GitHub release with its entry, to the MCP Registry, and
# to the plugin branch, which Anthropic's plugin directory follows. npm and the registry trust
# this workflow through GitHub's OIDC, so no token is stored. It runs once the repository is
# public, where npm records where each version was built. Each of the four happens once: a run
# that stopped partway, run again, finishes the rest.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # Node 24's own npm publishes through trusted publishing. Updated in place, npm loses the
      # sigstore it signs provenance with.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The release pull request, while changes wait
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: Release offprompt
          commit: 'chore: release offprompt'

      - name: Which parts of this version are due
        id: pending
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release pending
        env:
          GH_TOKEN: ${{ github.token }}

      # The release pull request was checked as it landed, like every change to main.
      - name: Publish to npm
        if: steps.pending.outputs.npm == 'true'
        run: pnpm release npm

      # npm takes minutes to serve a version it has just taken, and the next two look it up there:
      # Glama's Auto-Release installs offprompt from npm as soon as the GitHub release appears, and
      # the registry checks the version on npm.
      - name: Wait until npm serves it
        if: steps.pending.outputs.github == 'true' || steps.pending.outputs.registry == 'true'
        run: pnpm release wait-for-npm

      - name: A GitHub release with its changelog entry
        if: steps.pending.outputs.github == 'true'
        run: pnpm release github
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List it in the MCP Registry
        if: steps.pending.outputs.registry == 'true'
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # The directory reads a plugin's folder from GitHub, so the package npm has goes on a branch
      # of its own too, where it is the whole tree. The directory picks each push up from there.
      - name: The package on the plugin branch, for Anthropic's plugin directory
        if: steps.pending.outputs.plugin == 'true'
        run: pnpm release plugin
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
