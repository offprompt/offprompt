# Releases offprompt from main. Each change that reaches npm says what it is in a changeset
# (`pnpm changeset`); while any wait, Changesets keeps a "Release offprompt" pull request open
# with the next version and its changelog entry. Merging it is the release: the version npm
# does not have yet goes to npm, to a GitHub release with its entry, and to the MCP Registry.
# npm and the registry trust this workflow through GitHub's OIDC, so no token is stored. It
# runs once the repository is public, where npm records where each version was built. Each of
# the three happens once: a run that stopped partway, run again, finishes the rest.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # Node 24's own npm publishes through trusted publishing. Updated in place, npm loses the
      # sigstore it signs provenance with.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The release pull request, while changes wait
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: Release offprompt
          commit: 'chore: release offprompt'

      - name: Which parts of this version are due
        id: pending
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release pending
        env:
          GH_TOKEN: ${{ github.token }}

      # The release pull request was checked as it landed, like every change to main.
      - name: Publish to npm
        if: steps.pending.outputs.npm == 'true'
        run: pnpm release npm

      - name: A GitHub release with its changelog entry
        if: steps.pending.outputs.github == 'true'
        run: pnpm release github
        env:
          GH_TOKEN: ${{ github.token }}

      # The registry looks the version up on npm, which takes minutes to serve one it has just
      # taken.
      - name: List it in the MCP Registry, once npm serves it
        if: steps.pending.outputs.registry == 'true'
        run: |
          pnpm release wait-for-npm
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
